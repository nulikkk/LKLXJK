<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信＆隆·恋爱小窝 💕</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --pink-light: #fce4ec;
  --pink: #f8bbd0;
  --pink-deep: #f48fb1;
  --rose: #e91e63;
  --coral: #ff6b81;
  --white: #ffffff;
  --shadow: 0 4px 20px rgba(233,30,99,0.1);
  --shadow-hover: 0 8px 30px rgba(233,30,99,0.18);
  --radius: 20px;
  --radius-sm: 12px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Microsoft YaHei','PingFang SC',sans-serif;
  background: linear-gradient(135deg, #fce4ec 0%, #f8e8f0 30%, #e8eaf6 70%, #fce4ec 100%);
  background-attachment: fixed;
  min-height: 100vh;
  color: #5d3a4a;
  overflow-x: hidden;
}

/* ===== Floating Hearts Canvas ===== */
#heartsCanvas {
  position: fixed; top:0; left:0;
  width:100%; height:100%;
  pointer-events: none; z-index:0;
}

/* ===== Main Container ===== */
.app-container {
  max-width: 800px;
  margin:0 auto;
  padding: 16px;
  position: relative;
  z-index: 1;
}

/* ===== Header ===== */
.header {
  text-align: center;
  padding: 28px 20px 14px;
  position: relative;
}
.header .mascot {
  font-size: 48px;
  animation: bounce 1.2s ease-in-out infinite;
}
.header h1 {
  font-family: 'KaiTi','STKaiti','Microsoft YaHei',serif;
  font-size: 2rem;
  color: var(--rose);
  text-shadow: 2px 2px 8px rgba(233,30,99,0.15);
  margin: 6px 0;
}
.header .subtitle {
  color: #c97a8e;
  font-size: 0.95rem;
  letter-spacing: 2px;
}

@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

/* ===== Tab Nav ===== */
.tab-nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 10px 0 20px;
  position: sticky;
  top: 8px;
  z-index: 10;
}
.tab-btn {
  padding: 10px 18px;
  border: none;
  border-radius: 25px;
  background: var(--white);
  color: #b06a7e;
  cursor: pointer;
  font-size: 0.9rem;
  font-family: 'Microsoft YaHei','PingFang SC',sans-serif;
  box-shadow: var(--shadow);
  transition: all 0.3s ease;
  white-space: nowrap;
}
.tab-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.tab-btn.active {
  background: linear-gradient(135deg, var(--rose), var(--coral));
  color: white;
  box-shadow: 0 4px 16px rgba(233,30,99,0.35);
}

/* ===== Sections ===== */
.section {
  display: none;
  animation: fadeSlideIn 0.5s ease;
}
.section.active { display: block; }

@keyframes fadeSlideIn {
  from { opacity:0; transform: translateY(20px); }
  to { opacity:1; transform: translateY(0); }
}

/* ===== Card ===== */
.card {
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(233,30,99,0.06);
  transition: all 0.3s ease;
}
.card:hover { box-shadow: var(--shadow-hover); }

/* ===== Home Page ===== */
.love-counter-card {
  text-align: center;
  padding: 32px 20px;
  background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,240,245,0.9));
}
.love-counter-card .icon-row { font-size: 42px; margin-bottom: 8px; }
.love-counter-card .days-label { font-size: 1rem; color: #c97a8e; margin-bottom: 4px; }
.love-counter-card .days-number {
  font-family: 'KaiTi','STKaiti','Microsoft YaHei',serif;
  font-size: 4rem;
  font-weight: bold;
  color: var(--rose);
  line-height: 1;
  text-shadow: 2px 2px 12px rgba(233,30,99,0.2);
}
.love-counter-card .days-detail {
  font-size: 0.95rem;
  color: #b06a7e;
  margin-top: 4px;
  font-family: monospace;
}
.love-counter-card .start-date { font-size: 0.8rem; color: #c9a0ae; margin-top: 8px; }

.quote-card {
  text-align: center;
  padding: 18px 24px;
  background: linear-gradient(135deg, #fff8e1, #fce4ec);
  position: relative;
}
.quote-card .quote-text {
  font-family: 'KaiTi','STKaiti','Microsoft YaHei',serif;
  font-size: 1.1rem;
  color: #8d5a6a;
  line-height: 1.7;
}
.quote-card .quote-icon { font-size: 24px; position: absolute; top: -10px; left: 20px; }

.milestone-countdown {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
  text-align: center;
}
.countdown-item {
  background: rgba(255,255,255,0.9);
  border-radius: var(--radius-sm);
  padding: 16px 10px;
  box-shadow: var(--shadow);
}
.countdown-item .cd-icon { font-size: 28px; }
.countdown-item .cd-label { font-size: 0.75rem; color: #c97a8e; margin: 4px 0; }
.countdown-item .cd-days { font-size: 1.5rem; font-weight: bold; color: var(--rose); }

/* ===== Timeline ===== */
.timeline { position: relative; padding-left: 32px; }
.timeline::before {
  content: '';
  position: absolute;
  left: 16px; top:0; bottom:0;
  width: 3px;
  background: linear-gradient(to bottom, var(--pink-deep), #f3e5f5);
  border-radius: 2px;
}
.timeline-item {
  position: relative;
  margin-bottom: 22px;
  padding-left: 24px;
}
.timeline-item::before {
  content: '';
  position: absolute;
  left: -20px; top: 8px;
  width: 14px; height: 14px;
  background: var(--rose);
  border-radius: 50%;
  border: 3px solid var(--white);
  box-shadow: 0 2px 8px rgba(233,30,99,0.3);
}
.timeline-date { font-size: 0.8rem; color: #c97a8e; font-weight: bold; }
.timeline-title { font-size: 1rem; font-weight: bold; color: #6d3a4a; margin: 2px 0; }
.timeline-desc { font-size: 0.85rem; color: #9b7a86; line-height: 1.5; }
.timeline-img { max-width:100%; border-radius:12px; margin-top:10px; display:block; box-shadow:0 2px 8px rgba(0,0,0,0.08); }

/* ===== Diary ===== */
.diary-form { display: flex; flex-direction: column; gap: 12px; }
.diary-form .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.diary-form input[type="date"] {
  padding: 10px 14px;
  border: 2px solid #f0d0da;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 0.9rem;
  background: var(--white);
  color: #5d3a4a;
}
.mood-selector { display: flex; gap: 6px; flex-wrap: wrap; }
.mood-btn {
  font-size: 1.5rem;
  padding: 6px 10px;
  border: 2px solid transparent;
  border-radius: 25px;
  background: rgba(255,255,255,0.8);
  cursor: pointer;
  transition: all 0.2s;
}
.mood-btn:hover, .mood-btn.selected {
  border-color: var(--pink-deep);
  background: var(--pink-light);
  transform: scale(1.1);
}
.diary-form textarea {
  width: 100%;
  min-height: 120px;
  padding: 14px;
  border: 2px solid #f0d0da;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 0.95rem;
  resize: vertical;
  background: var(--white);
  color: #5d3a4a;
  line-height: 1.7;
}
.diary-form textarea:focus,
.diary-form input:focus {
  outline: none;
  border-color: var(--pink-deep);
  box-shadow: 0 0 0 3px rgba(244,143,177,0.2);
}

.btn {
  padding: 10px 24px;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  font-size: 0.9rem;
  font-family: inherit;
  transition: all 0.3s ease;
  font-weight: bold;
}
.btn-primary {
  background: linear-gradient(135deg, var(--rose), var(--coral));
  color: white;
  box-shadow: 0 4px 14px rgba(233,30,99,0.3);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(233,30,99,0.4); }
.btn-danger { background: #fff; color: #d32f2f; border: 2px solid #ffcdd2; }
.btn-danger:hover { background: #ffebee; }
.btn-sm { padding: 6px 14px; font-size: 0.8rem; }

/* Tag filter */
.tag-btn {
  padding: 4px 12px;
  border: 1.5px solid #f0d0da;
  border-radius: 15px;
  background: white;
  color: #b06a7e;
  cursor: pointer;
  font-size: 0.78rem;
  font-family: inherit;
  transition: all 0.2s;
  white-space: nowrap;
}
.tag-btn:hover, .tag-btn.active { background: var(--pink-light); border-color: var(--pink-deep); color: var(--rose); }

.diary-list { display: flex; flex-direction: column; gap: 12px; }
.diary-card {
  background: rgba(255,255,255,0.9);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  border-left: 5px solid var(--pink);
  position: relative;
}
.diary-card .diary-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.diary-card .diary-date { font-size: 0.8rem; color: #c97a8e; }
.diary-card .diary-mood { font-size: 1.3rem; }
.diary-card .diary-text { font-size: 0.9rem; color: #6d4a5a; line-height: 1.7; white-space: pre-wrap; }
.diary-card .diary-actions { margin-top: 10px; display: flex; gap: 8px; justify-content: flex-end; }

.empty-state { text-align: center; padding: 40px 20px; color: #c9a0ae; }
.empty-state .empty-icon { font-size: 48px; }
.empty-state p { margin-top: 8px; }

/* ===== Photos ===== */
.upload-area {
  border: 3px dashed #f0d0da;
  border-radius: var(--radius);
  padding: 32px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  background: rgba(255,255,255,0.5);
}
.upload-area:hover { border-color: var(--pink-deep); background: rgba(252,228,236,0.4); }
.upload-area .upload-icon { font-size: 42px; }
.upload-area p { color: #c97a8e; margin-top: 6px; }

.photo-title-input {
  width: 100%;
  padding: 10px 14px;
  border: 2px solid #f0d0da;
  border-radius: var(--radius-sm);
  margin-top: 8px;
  font-family: inherit;
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  margin-top: 16px;
}
.photo-card {
  border-radius: var(--radius-sm);
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.3s;
  background: white;
  position: relative;
}
.photo-card:hover { transform: scale(1.03); box-shadow: var(--shadow-hover); }
.photo-card img { width: 100%; height: 140px; object-fit: cover; display: block; }
.photo-card .photo-info { padding: 8px 10px; font-size: 0.75rem; color: #8d6a78; }
.photo-card .photo-delete {
  position: absolute;
  top: 6px; right: 6px;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: rgba(255,255,255,0.9);
  border: none;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
}
.photo-card:hover .photo-delete { opacity: 1; }

/* Lightbox */
.lightbox {
  display: none;
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}
.lightbox.show { display: flex; }
.lightbox img { max-width: 90vw; max-height: 75vh; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
.lightbox .lb-caption { color: #fce4ec; margin-top: 14px; font-size: 1rem; }
.lightbox .lb-close { position: absolute; top:20px; right:30px; font-size:32px; color:white; cursor:pointer; background:none; border:none; }

/* ===== Notes Wall ===== */
.note-form { display: flex; gap: 10px; flex-wrap: wrap; }
.note-form input {
  flex: 1;
  min-width: 200px;
  padding: 12px 16px;
  border: 2px solid #f0d0da;
  border-radius: 25px;
  font-family: inherit;
  font-size: 0.9rem;
  background: var(--white);
}
.note-form input:focus { outline: none; border-color: var(--pink-deep); box-shadow: 0 0 0 3px rgba(244,143,177,0.2); }

.notes-wall {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
  margin-top: 16px;
}
.note-sticky {
  padding: 18px 14px;
  border-radius: 4px 20px 4px 20px;
  min-height: 100px;
  position: relative;
  box-shadow: 2px 4px 12px rgba(0,0,0,0.08);
  transform: rotate(-1deg);
  transition: all 0.3s;
  font-size: 0.9rem;
  line-height: 1.6;
  word-break: break-word;
}
.note-sticky:hover { transform: rotate(0deg) scale(1.03); }
.note-sticky:nth-child(2n) { transform: rotate(1.5deg); border-radius: 20px 4px 20px 4px; }
.note-sticky:nth-child(3n) { transform: rotate(-2deg); }
.note-sticky:nth-child(2n):hover, .note-sticky:nth-child(3n):hover { transform: rotate(0deg) scale(1.03); }

.note-delete { position: absolute; top:6px; right:8px; background:none; border:none; cursor:pointer; font-size:14px; opacity:0.5; transition: opacity 0.2s; }
.note-delete:hover { opacity: 1; }

.nc0 { background: #fff8e1; }
.nc1 { background: #fce4ec; }
.nc2 { background: #e0f2f1; }
.nc3 { background: #f3e5f5; }
.nc4 { background: #e8eaf6; }
.nc5 { background: #fff3e0; }

/* ===== Edit Modal ===== */
.modal-overlay {
  display: none;
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  justify-content: center;
  align-items: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: white;
  border-radius: var(--radius);
  padding: 24px;
  width: 90%;
  max-width: 500px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal-box textarea {
  width: 100%;
  min-height: 100px;
  padding: 12px;
  border: 2px solid #f0d0da;
  border-radius: var(--radius-sm);
  font-family: inherit;
  resize: vertical;
}
.modal-box .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

/* ===== Sync Status ===== */
#syncStatus { transition: all 0.3s; }

/* ===== Music Player ===== */
.music-player {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}
.music-btn {
  width: 54px; height: 54px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--rose), var(--coral));
  box-shadow: 0 4px 16px rgba(233,30,99,0.35);
  cursor: pointer;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}
.music-btn:hover { transform: scale(1.1); }
.music-btn.playing { animation: spinDisc 3s linear infinite; }
@keyframes spinDisc {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.music-panel {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  width: 260px;
  display: none;
  flex-direction: column;
  gap: 8px;
}
.music-panel.show { display: flex; }
.music-panel input {
  padding: 8px 12px;
  border: 2px solid #f0d0da;
  border-radius: 12px;
  font-family: inherit;
  font-size: 0.8rem;
  width: 100%;
}
.music-ctrl {
  display: flex;
  align-items: center;
  gap: 8px;
}
.music-ctrl button {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: none;
  background: var(--pink-light);
  cursor: pointer;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.music-ctrl button:hover { background: var(--pink); }

/* Music playlist */
.music-playlist {
  max-height: 200px;
  overflow-y: auto;
  margin-bottom: 4px;
}
.music-playlist::-webkit-scrollbar { width: 4px; }
.music-playlist::-webkit-scrollbar-thumb { background: var(--pink); border-radius: 2px; }
.music-playlist-item {
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: background 0.15s;
  border-bottom: 1px solid #fef0f3;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.music-playlist-item:hover { background: var(--pink-light); }
.music-playlist-item.active { background: #ffe0ea; }
.music-playlist-item .mpi-name { font-weight: 500; color: #5d3a4a; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.music-playlist-item .mpi-del {
  font-size: 14px;
  padding: 2px 6px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  color: #ccc;
  flex-shrink: 0;
  margin-left: 4px;
}
.music-playlist-item .mpi-del:hover { color: var(--rose); background: #fff0f3; }
.music-status { text-align: center; color: #999; padding: 8px; font-size: 0.75rem; }

/* ===== Floating Notes ===== */
.note-float {
  position: fixed;
  font-size: 20px;
  pointer-events: none;
  z-index: 199;
  animation: noteUp 2s ease-out forwards;
}
@keyframes noteUp {
  0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  100% { opacity: 0; transform: translateY(-100px) rotate(20deg) scale(0.5); }
}

/* ===== Responsive ===== */
@media (max-width: 600px) {
  .app-container { padding: 10px; }
  .header h1 { font-size: 1.5rem; }
  .tab-btn { padding: 8px 13px; font-size: 0.78rem; }
  .love-counter-card .days-number { font-size: 2.8rem; }
  .milestone-countdown { grid-template-columns: repeat(2, 1fr); }
  .photo-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .notes-wall { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<canvas id="heartsCanvas"></canvas>

<div class="app-container">
  <header class="header">
    <div class="mascot">🧸</div>
    <h1>我们的小窝 💕</h1>
    <p class="subtitle">♡ 始于 2026.05.20 ♡ <span id="syncStatus" style="font-size:0.65rem;color:#4caf50;display:none">●</span></p>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="home">🏠 首页</button>
    <button class="tab-btn" data-tab="timeline">📜 我们的故事</button>
    <button class="tab-btn" data-tab="diary">📔 恋爱日记</button>
    <button class="tab-btn" data-tab="photos">📸 照片墙</button>
    <button class="tab-btn" data-tab="notes">💌 甜蜜便签</button>
  </nav>

  <!-- ===== Home ===== -->
  <section class="section active" id="home">
    <div class="card love-counter-card">
      <div class="icon-row">💕</div>
      <div class="days-label">我们已经在一起</div>
      <div class="days-number" id="daysCount">--</div>
      <div class="days-detail" id="daysDetail">--</div>
      <div class="start-date">2026年5月20日 · 从此每一天都是甜的</div>
    </div>

    <div class="card quote-card">
      <div class="quote-icon">💭</div>
      <p class="quote-text" id="quoteText"></p>
      <div style="margin-top:6px;font-size:0.75rem;color:#c9a0ae;cursor:pointer" onclick="nextQuote()">🔄 换一句</div>
    </div>

    <div class="card">
      <h3 style="text-align:center;color:#c97a8e;margin-bottom:14px;">🎯 纪念日倒计时</h3>
      <div class="milestone-countdown" id="milestoneCountdown"></div>
    </div>
  </section>

  <!-- ===== Timeline ===== -->
  <section class="section" id="timeline">
    <div class="card">
      <h3 style="text-align:center;color:var(--rose);margin-bottom:8px;">📜 我们的故事</h3>
      <p style="text-align:center;color:#c97a8e;font-size:0.85rem;margin-bottom:18px;">每一步，都是心动的痕迹</p>
      <div class="timeline" id="timelineContainer"></div>
    </div>
    <div class="card">
      <h4 style="color:#6d3a4a;margin-bottom:10px;">✨ 添加新的纪念时刻</h4>

function setupRealtime() {

    db.channel(table + '-rt')
      .on('postgres_changes', { event: '*', schema: 'public', table }, async () => {
        const { data } = await db.from(table).select('*');
        if (data) { setter(data); renderFn(); if (table === 'photos') renderTagFilter(); saveCache(); }
      }).subscribe();
  };
  watch('timeline', d => { timelineData = d; }, renderTimeline);
  watch('diary', d => { diaryData = d; }, renderDiaryList);

}

// ============================================================
//  FLOATING HEARTS CANVAS
// ============================================================
(function() {
  const canvas = document.getElementById('heartsCanvas');
  const ctx = canvas.getContext('2d');
  let hearts = [];
  let w, h;
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  function mkHeart() {
    const size = Math.random() * 18 + 10;
    return {
      x: Math.random() * w, y: h + size, size,
      speed: Math.random() * 1.2 + 0.4,
      opacity: Math.random() * 0.5 + 0.3,
      drift: Math.random() * 0.6 - 0.3,
      color: ['#f48fb1','#ff6b81','#e91e63','#f8bbd0','#ff8a80','#ea80fc'][Math.floor(Math.random()*6)]
    };
  }

  function drawHeart(ctx, x, y, size, color, opacity) {
    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.fillStyle = color;
    ctx.beginPath();
    const s = size / 20;
    ctx.moveTo(x, y + size * 0.3);
    ctx.bezierCurveTo(x, y, x - size * 0.5, y, x - size * 0.5, y + size * 0.3);
    ctx.bezierCurveTo(x - size * 0.5, y + size * 0.7, x, y + size * 0.85, x, y + size);
    ctx.bezierCurveTo(x, y + size * 0.85, x + size * 0.5, y + size * 0.7, x + size * 0.5, y + size * 0.3);
    ctx.bezierCurveTo(x + size * 0.5, y, x, y, x, y + size * 0.3);
    ctx.fill();
    ctx.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, w, h);
    if (hearts.length < 35) hearts.push(mkHeart());
    hearts = hearts.filter(h => h.y > -h.size * 2);
    hearts.forEach(h => {
      h.y -= h.speed;
      h.x += h.drift;
      h.opacity -= 0.0004;
      drawHeart(ctx, h.x, h.y, h.size, h.color, h.opacity);
    });
    requestAnimationFrame(animate);
  }
  animate();
})();

// 压缩时间线照片（本地上传 → base64）
function compressTimelinePhoto() {
  const file = document.getElementById('newEventPhoto').files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      const maxW = 600;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      document.getElementById('newEventImage').value = canvas.toDataURL('image/jpeg', 0.6);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  document.getElementById('editModal').classList.add('show');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  currentEditId = null;
}

async function saveEditDiary() {
  if (!currentEditId) return;
  const content = document.getElementById('editDiaryContent').value.trim();
  if (!content) return alert('内容不能为空哦~');
  const { error } = await db.from('diary').update({ content, mood: editMood }).eq('id', currentEditId);
  if (error) { alert('更新失败: ' + error.message); return; }
  const { data } = await db.from('diary').select('*').order('date', { ascending: false });
  if (data) { diaryData = data; renderDiaryList(); saveCache(); }
  closeEditModal();
}

// ============================================================
//  PHOTOS
// ============================================================
document.getElementById('uploadArea').addEventListener('click', function(e) {
  if (e.target.tagName !== 'INPUT') document.getElementById('photoInput').click();
});

document.getElementById('photoInput').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) return alert('请选择图片文件哦~');
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = async function() {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      const maxW = 800;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', 0.7);
      const title = document.getElementById('photoTitle').value.trim() || '甜蜜瞬间';
      const tags = document.getElementById('photoTags').value.trim();
      const date = new Date().toISOString().split('T')[0];
      const { error } = await db.from('photos').insert([{ title, src: compressed, date, tags }]);
      if (error) { alert('上传失败: ' + error.message); return; }
      const { data } = await db.from('photos').select('*').order('created_at', { ascending: false });
      if (data) { photoData = data; renderPhotos(); renderTagFilter(); saveCache(); }
      document.getElementById('photoTitle').value = '';
      document.getElementById('photoTags').value = '';
      document.getElementById('photoInput').value = '';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
});

// 提取所有标签
function getAllTags() {
  const tagSet = new Set();
  photoData.forEach(p => {
    if (p.tags) p.tags.split(',').forEach(t => {
      const tag = t.trim();
      if (tag) tagSet.add(tag);
    });
  });
  return [...tagSet];
}

function renderTagFilter() {
  const container = document.getElementById('tagFilter');
  const tags = getAllTags();
  if (tags.length === 0) { container.innerHTML = ''; return; }
  container.innerHTML = `<span style="font-size:0.85rem;color:#c97a8e;margin-right:4px">🏷️</span>
    <button class="tag-btn ${selectedTag === null ? 'active' : ''}" onclick="filterByTag(null)">全部</button>
    ${tags.map(t => `<button class="tag-btn ${selectedTag === t ? 'active' : ''}" onclick="filterByTag('${t}')">${t}</button>`).join('')}`;
}

function filterByTag(tag) {
  selectedTag = tag;
  renderTagFilter();
  renderPhotos();
}

function renderPhotos() {
  const c = document.getElementById('photoGrid');
  let filtered = photoData;
  if (selectedTag) {
    filtered = photoData.filter(p => {
      if (!p.tags) return false;
      return p.tags.split(',').map(t => t.trim()).includes(selectedTag);
    });
  }
  if (filtered.length === 0) {
    c.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🖼️</div><p>还没有照片呢，快上传你们的甜蜜合照吧~</p></div>';
    return;
  }
  c.innerHTML = filtered.map(p => `
    <div class="photo-card" onclick="openLightbox(${p.id})">
      <img src="${p.src}" alt="${p.title}" loading="lazy">
      <button class="photo-delete" onclick="event.stopPropagation();deletePhoto(${p.id})">✕</button>
      <div class="photo-info">${p.title}${p.tags ? '<br><small>🏷️ ' + p.tags + '</small>' : ''}<br><small>${p.date}</small></div>
    </div>
  `).join('');
}

async function deletePhoto(id) {
  if (!confirm('确定要删除这张照片吗？')) return;
  const { error } = await db.from('photos').delete().eq('id', id);
  if (error) { alert('删除失败: ' + error.message); return; }
  const { data } = await db.from('photos').select('*').order('created_at', { ascending: false });
  if (data) { photoData = data; renderPhotos(); renderTagFilter(); saveCache(); }
}

function openLightbox(id) {
  const photo = photoData.find(p => p.id === id);
  if (!photo) return;
  document.getElementById('lightboxImg').src = photo.src;
  document.getElementById('lightboxCaption').textContent = photo.title + ' · ' + photo.date;
  document.getElementById('lightbox').classList.add('show');
}

function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }

document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) closeLightbox();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLightbox();
});

// ============================================================
//  NOTES
// ============================================================
async function addNote() {
  const content = document.getElementById('noteContent').value.trim();
  if (!content) return;
  const { error } = await db.from('notes').insert([{
    content,
    color_idx: Math.floor(Math.random() * 6),
    date: new Date().toISOString().split('T')[0]
  }]);
  if (error) { alert('添加失败: ' + error.message); return; }
  const { data } = await db.from('notes').select('*').order('created_at', { ascending: false });
  if (data) { noteData = data; renderNotes(); saveCache(); }
  document.getElementById('noteContent').value = '';
}

async function deleteNote(id) {
  const { error } = await db.from('notes').delete().eq('id', id);
  if (error) { alert('删除失败: ' + error.message); return; }
  const { data } = await db.from('notes').select('*').order('created_at', { ascending: false });
  if (data) { noteData = data; renderNotes(); saveCache(); }
}

function renderNotes() {
  const c = document.getElementById('notesWall');
  if (noteData.length === 0) {
    c.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">💌</div><p>还没有便签，写一张给Ta吧~</p></div>';
    return;
  }
  c.innerHTML = noteData.map(n => `
    <div class="note-sticky nc${n.color_idx}">
      <button class="note-delete" onclick="deleteNote(${n.id})">✕</button>
      <p>${n.content}</p>
      <small style="color:#999;display:block;margin-top:8px">${n.date}</small>
    </div>
  `).join('');
}

// ============================================================
//  MUSIC PLAYER
// ============================================================
let audioEl = null;
let isPlaying = false;
let currentSong = null;
let musicFileList = [];

async function loadMusicList() {
  const list = document.getElementById('musicPlaylist');
  try {
    const { data, error } = await db.storage.from('music').list();
    if (error) throw error;
    musicFileList = (data || []).filter(f => f.name !== '.emptyFolderPlaceholder' && f.id);
    if (!musicFileList.length) {
      list.innerHTML = '<div class="music-status">还没有歌曲，点 📂 上传</div>';
      return;
    }
    list.innerHTML = musicFileList.map((f, i) => {
      const name = musicDisplayName(f.name);
      const isActive = currentSong && currentSong.name === f.name;
      return `<div class="music-playlist-item${isActive ? ' active' : ''}" onclick="musicPlayFromList(${i})">
        <span class="mpi-name">🎵 ${name}</span>
        <button class="mpi-del" onclick="event.stopPropagation();musicDeleteSong(${i})" title="删除">🗑</button>
      </div>`;
    }).join('');
  } catch(e) {
    if (e.message && e.message.includes('not found')) {
      list.innerHTML = '<div class="music-status">请先在 Supabase 创建 music 存储桶</div>';
    } else {
      list.innerHTML = '<div class="music-status">加载歌单失败</div>';
    }
  }
}

function musicPlayFromList(i) {
  const f = musicFileList[i];
  if (!f) return;
  if (audioEl) { audioEl.pause(); audioEl = null; }
  const { data: urlData } = db.storage.from('music').getPublicUrl(f.name);
  const url = urlData.publicUrl;
  audioEl = new Audio(url);
  audioEl.loop = true;
  audioEl.volume = parseFloat(document.getElementById('musicVolume').value) || 0.5;
  currentSong = { name: f.name, url };
  audioEl.play().then(() => {
    isPlaying = true;
    document.getElementById('musicPlayBtn').textContent = '⏸';
    document.getElementById('musicBtn').classList.add('playing');
    document.getElementById('musicStatus').textContent = '🎵 ' + musicDisplayName(f.name);
    musicSpawnNotes();
    db.from('settings').upsert({ key: 'music_url', value: url });
  }).catch(() => {
    document.getElementById('musicStatus').textContent = '⚠️ 播放失败';
  });
  loadMusicList();
}

async function musicDeleteSong(i) {
  const f = musicFileList[i];
  if (!f) return;
  if (!confirm('确定删除 "' + musicDisplayName(f.name) + '" 吗？')) return;
  const { error } = await db.storage.from('music').remove([f.name]);
  if (error) return alert('删除失败: ' + error.message);
  if (currentSong && currentSong.name === f.name) {
    if (audioEl) { audioEl.pause(); audioEl = null; }
    isPlaying = false;
    currentSong = null;
    document.getElementById('musicPlayBtn').textContent = '▶️';
    document.getElementById('musicBtn').classList.remove('playing');
    document.getElementById('musicStatus').textContent = '📂 上传歌曲到歌单';
  }
  loadMusicList();
}

function musicTogglePlay() {
  const btn = document.getElementById('musicPlayBtn');
  const disc = document.getElementById('musicBtn');
  if (isPlaying) {
    if (audioEl) audioEl.pause();
    btn.textContent = '▶️';
    disc.classList.remove('playing');
    isPlaying = false;
  } else {
    if (audioEl) {
      audioEl.play().then(() => {
        btn.textContent = '⏸';
        disc.classList.add('playing');
        isPlaying = true;
        musicSpawnNotes();
      }).catch(() => {
        document.getElementById('musicStatus').textContent = '⚠️ 播放失败';
      });
    }
  }
}

function musicSetVolume(v) {
  if (audioEl) audioEl.volume = parseFloat(v);
}

async function musicUploadFile() {
  const file = document.getElementById('musicFileInput').files[0];
  if (!file) return;
  if (file.size > 50 * 1024 * 1024) return alert('文件太大了，请选 50MB 以内的～');

  const dotIdx = file.name.lastIndexOf('.');
  const base = dotIdx > 0 ? file.name.substring(0, dotIdx) : file.name;
  const ext = dotIdx > 0 ? file.name.substring(dotIdx + 1).toLowerCase() : 'mp3';
  // Base64url-encode UTF-8 to keep Chinese in ASCII-safe form for Supabase Storage
  let safeName = b64Encode(base);
  if (safeName.length > 100) safeName = safeName.substring(0, 100);
  safeName = safeName + '_' + Date.now() + '.' + ext;

  document.getElementById('musicStatus').textContent = '⬆️ 上传中...';
  const { data, error } = await db.storage.from('music').upload(safeName, file, {
    cacheControl: '3600', contentType: file.type || 'audio/mpeg'
  });
  if (error) {
    console.error('Upload error:', JSON.stringify(error));
    document.getElementById('musicStatus').textContent = '❌ 上传失败';
    if (error.message.includes('row-level security') || error.message.includes('policy')) {
      return alert('权限不足！请在 Supabase SQL Editor 中运行 migration_v3.sql');
    }
    return alert('上传失败: ' + error.message);
  }
  document.getElementById('musicFileInput').value = '';
  document.getElementById('musicStatus').textContent = '✅ 上传成功';
  loadMusicList();
}

// UTF-8 → base64url (ASCII-safe, reversible)
function b64Encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64Decode(enc) {
  let b64 = enc.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// Extract display name from storage key (decode base64url part before _timestamp.ext)
function musicDisplayName(key) {
  const noExt = key.replace(/\.[^.]+$/, '');
  const lastUnderscore = noExt.lastIndexOf('_');
  if (lastUnderscore < 0) return key;
  const tsPart = noExt.substring(lastUnderscore + 1);
  // Timestamp is 13 digits
  if (/^\d{13}$/.test(tsPart)) {
    const encoded = noExt.substring(0, lastUnderscore);
    try { return b64Decode(encoded); } catch(e) { return encoded; }
  }
  return noExt;
}

function musicTogglePanel() {
  document.getElementById('musicPanel').classList.toggle('show');
  if (document.getElementById('musicPanel').classList.contains('show')) loadMusicList();
}
function musicHidePanel() { document.getElementById('musicPanel').classList.remove('show'); }

function musicSpawnNotes() {
  if (!isPlaying) return;
  const rect = document.getElementById('musicBtn').getBoundingClientRect();
  const notes = ['🎵', '🎶', '💕', '✨'];
  const el = document.createElement('div');
  el.className = 'note-float';
  el.textContent = notes[Math.floor(Math.random() * notes.length)];
  el.style.left = (rect.left + rect.width / 2 - 10 + (Math.random() - 0.5) * 40) + 'px';
  el.style.bottom = (window.innerHeight - rect.top + 10) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
  setTimeout(musicSpawnNotes, 800 + Math.random() * 1200);
}
